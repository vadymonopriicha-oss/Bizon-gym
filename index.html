<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bizon GYM</title><style>
body{margin:0;background:#090c10;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1000px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #29313a;padding:15px 0}.logo{font-size:28px;font-weight:900}.logo span{color:#62e6a4}button{background:#62e6a4;border:0;padding:11px 16px;border-radius:10px;font-weight:800;cursor:pointer}input,textarea,select{width:100%;padding:12px;margin:6px 0;background:#141a21;color:#fff;border:1px solid #303943;border-radius:9px;box-sizing:border-box}.hero{padding:55px 0}.hero h1{font-size:55px;margin:0}.muted{color:#9da7b1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:#141a21;border:1px solid #29313a;border-radius:16px;padding:18px}.price{font-size:21px;font-weight:900;margin:10px 0}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px}.box{background:#151b22;padding:22px;border-radius:16px;width:min(430px,100%)}.x{float:right;background:none;color:#fff;font-size:22px}
</style></head><body><div class="wrap"><div class="top"><div class="logo">BIZON <span>GYM</span></div><div><button onclick="openLogin()">Войти</button></div></div>
<section class="hero"><h1>Тренируйся.<br>Становись сильнее.</h1><p class="muted">Тренировочные программы для зала, дома и площадки.</p></section>
<h2>Программы</h2><div id="programs" class="grid"></div><h2>Мой аккаунт</h2><div id="me" class="card">Загрузка...</div></div>
<div id="modal" class="modal"><div class="box"><button class="x" onclick="closeModal()">×</button><div id="form"></div></div></div>
<script>
async function load(){let p=await fetch("/api/programs").then(r=>r.json());document.getElementById("programs").innerHTML=p.map(x=>`<div class="card"><div>🏋️ ${x.category}</div><h3>${x.title}</h3><p class="muted">${x.description||""}</p><div class="price">${Number(x.price_pln).toFixed(2)} zł</div><button onclick="alert('Оплата подключается следующим этапом')">Купить</button></div>`).join("")||"<p class='muted'>Программ пока нет.</p>";let m=await fetch("/api/me").then(r=>r.json());document.getElementById("me").innerHTML=m.user?`Вы вошли как <b>${m.user.email}</b>${m.user.is_admin?"<br><br>👑 Администратор":""}<br><br><button onclick="logout()">Выйти</button>`:"Вы не вошли. Нажмите «Войти»."}
function openLogin(){form.innerHTML='<h2>Вход</h2><input id="email" placeholder="E-mail"><input id="password" type="password" placeholder="Пароль"><button onclick="login()">Войти</button><p><button onclick="register()">Создать аккаунт</button></p>';modal.style.display="flex"}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});let d=await r.json();if(!r.ok)return alert(d.error);closeModal();load()}
async function register(){let r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});let d=await r.json();if(!r.ok)return alert(d.error);closeModal();load()}
async function logout(){await fetch("/api/logout",{method:"POST"});load()}function closeModal(){modal.style.display="none"}load();
</script></body></html>
